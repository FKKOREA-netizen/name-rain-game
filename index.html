let dragPointer=null,dragTarget=null;

function direction(){let a=[...pressed.values()].sort((a,b)=>b.order-a.order);return a.length?a[0].dir:(Number(keyboard.right)-Number(keyboard.left))}
for(let id of ['left','right']){let dir=id==='left'?-1:1;$(id).addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='running')return;$(id).setPointerCapture(e.pointerId);pressed.set(e.pointerId,{dir,order:++pressOrder,id});$(id).classList.add('pressed');void 0});for(let ev of ['pointerup','pointercancel','lostpointercapture'])$(id).addEventListener(ev,e=>{pressed.delete(e.pointerId);if(![...pressed.values()].some(p=>p.id===id))$(id).classList.remove('pressed')});$(id).addEventListener('contextmenu',e=>e.preventDefault())}
function trackFinger(e){let r=canvas.getBoundingClientRect();dragTarget=clamp((e.clientX-r.left)*W/r.width,player.w/2+4,W-player.w/2-4);}
canvas.addEventListener('pointerdown',e=>{if(state!=='running')return;e.preventDefault();dragPointer=e.pointerId;canvas.setPointerCapture(e.pointerId);trackFinger(e);});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===dragPointer){e.preventDefault();trackFinger(e);}});
for(let ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{if(e.pointerId===dragPointer){dragPointer=null;dragTarget=null;}});
window.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){e.preventDefault();let side=['ArrowLeft','a','A'].includes(e.key)?'left':'right';if(!keyboard[side])void 0;keyboard[side]=true}});window.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keyboard.left=false;if(['ArrowRight','d','D'].includes(e.key))keyboard.right=false});window.addEventListener('blur',()=>{if(state==='running')pause();clearInputs()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause()});
function showScreen(id){for(let k of ['home','game','stages'])$(k).classList.toggle('hidden',k!==id)}
function stageScreen(){if(submitting)return;runEpoch++;state='menu';clearInputs();$('resultModal').classList.add('hidden');showScreen('stages');$('stageChoices').replaceChildren();for(let i=1;i<=4;i++){let b=document.createElement('button');b.className='choice';b.textContent='Stage '+i+' · '+bosses[i].name;b.disabled=i>progress.cleared+1;b.onclick=()=>start('stage',i);$('stageChoices').append(b)}}
function home(){if(submitting)return;runEpoch++;state='home';clearInputs();$('resultModal').classList.add('hidden');showScreen('home')}
function start(m=mode,st=stage){if(submitting)return;runEpoch++;mode=m;stage=st;time=score=0;items=[];tokens=[];pending=null;spawnClock=0;rowClock=0;nextMystery=30;waveActive=false;effect={number:1,name:1};effectUntil=0;ghostReady=dashReady=0;ghostUntil=dashUntil=-1;taps={left:-100,right:-100};submitted=false;resultClear=false;runId=crypto.randomUUID();player.name=$('username').value.trim()||'Username';player.w=Math.min(92,Math.max(50,Array.from(player.name).length*12+14));hp=mode==='stage'?bosses[stage].hp:0;state='running';clearInputs();$('resultModal').classList.add('hidden');$('boss').classList.toggle('hidden',mode!=='stage');showScreen('game');resize();player.x=W/2;names=['상구','준식'];fetchNames();$('gameHint').textContent='화살표 또는 화면 드래그로 이동 · 이름에 닿으면 종료';$('pauseBtn').textContent='일시정지';updateUI()}
function pause(){if(state==='running'){state='paused';clearInputs();$('pauseBtn').textContent='계속하기';$('gameHint').textContent='일시정지 · 계속하기 버튼으로 재개'}else if(state==='paused'){state='running';$('pauseBtn').textContent='일시정지';$('gameHint').textContent='플레이 재개'}}
function finish(clear=false){state='over';clearInputs();resultClear=clear;if(clear){progress.cleared=Math.max(progress.cleared,stage);writeLocal('nameRainCampaignV1',progress)}$('resultModal').classList.remove('hidden');$('resultTitle').textContent=clear?bosses[stage].msg:(mode==='hard'?'ㅋ':mode==='noob'?'이걸 못하네?':'다시 도전!');$('resultTitle').className=mode==='hard'&&!clear?'death':'';$('resultTitle').style.whiteSpace='pre-line';$('resultDetail').textContent=(mode==='stage'?'Stage '+stage:mode.toUpperCase())+' · '+time.toFixed(3)+'초 · '+fmt(score)+'점';$('registration').classList.toggle('hidden',mode==='stage'&&(!clear||stage!==4));$('rankName').value=player.name;$('resultStatus').textContent=clear&&stage<4?'다음 Stage가 열렸어요!':'';$('submitBtn').disabled=false;$('submitBtn').textContent='기록 등록'}
function updateUI(){$('score').textContent=fmt(score)+'점';$('time').textContent=time.toFixed(1)+'초';$('modeText').textContent=mode==='stage'?'STAGE '+stage:'INFINITE · '+mode.toUpperCase();$('formula').textContent=expression()||'숫자를 모으세요';if(mode==='stage'){let b=bosses[stage];$('boss').replaceChildren();if(stage===1){let angel=document.createElement('div');angel.className='pixel-angel';angel.setAttribute('aria-hidden','true');$('boss').append(angel);}let title=document.createElement('div');title.className='boss-name';title.textContent=b.name.replace('🪽 ','');let weak=document.createElement('div');weak.className='boss-weak';weak.textContent='약점 '+b.weak;let bar=document.createElement('div');bar.className='hp-track';bar.setAttribute('role','progressbar');bar.setAttribute('aria-label',b.name+' 체력');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax',String(b.hp));bar.setAttribute('aria-valuenow',String(Math.max(0,hp)));let fill=document.createElement('div');fill.className='hp-fill';fill.style.width=(Math.max(0,hp)/b.hp*100)+'%';let text=document.createElement('span');text.className='hp-text';text.textContent='HP: '+Math.max(0,hp)+' / '+b.hp;bar.append(fill,text);$('boss').append(title,weak,bar)}}
function hit(it){let y=H-35,extra=it.type==='name'?Math.min(it.w*.1,8):0;return Math.abs(it.x-player.x)<(it.w+player.w)/2+extra&&Math.abs(it.y-y)<(it.h+player.h)/2+extra}
function tick(dt){time+=dt;if(effectUntil>0&&time>=effectUntil){effect={number:1,name:1};effectUntil=0;}let accel=1+2*Math.min(time/180,1),hard=mode==='hard'?1.2:1,move=direction(),rate=1.25*Math.min(430,W*.95)*accel;if(move){dragTarget=null;player.x+=move*rate*dt;}else if(dragTarget!==null){let delta=dragTarget-player.x;player.x+=Math.sign(delta)*Math.min(Math.abs(delta),rate*dt);}player.x=clamp(player.x,player.w/2+4,W-player.w/2-4);if(mode!=='stage'&&time>=nextMystery){nextMystery+=30;mysteryWave()}if(waveActive){if(!items.some(i=>i.type==='mystery')){waveActive=false;spawnClock=0}}else{spawnClock+=dt;if(spawnClock>=Math.max(.16,.29-time*.0007)){spawnClock=0;spawn()}}if(mode==='stage'&&stage===4){rowClock+=dt;let travel=H/(H*.55*accel);if(rowClock>=Math.max(1.1,travel*.85+.35)){rowClock=0;stageRow()}}for(let i=items.length-1;i>=0;i--){let it=items[i],speed=H*.55*accel*hard*(it.base/1.35);speed*=it.type==='name'?effect.name:it.type==='mystery'?1:effect.number;it.y+=speed*dt;it.angle+=it.spin*dt;if(hit(it)){if(it.type==='name'){finish();break}collect(it);items.splice(i,1);if(state!=='running')break}else if(it.y>H+70)items.splice(i,1)}updateUI()}
function pixelBox(x,y,w,h,fill,edge){ctx.fillStyle='#030713';ctx.fillRect(x+3,y+4,w,h);ctx.fillStyle=edge;ctx.fillRect(x+3,y,w-6,h);ctx.fillRect(x,y+3,w,h-6);ctx.fillStyle=fill;ctx.fillRect(x+3,y+3,w-6,h-6);}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#0c142c';ctx.fillRect(0,0,W,H);
 // Distant pixel nebula, stepped moon, and parallax starlight.
 ctx.fillStyle='#111e3a';ctx.fillRect(W*.58,32,W*.42,110);ctx.fillRect(W*.66,16,W*.34,142);
 ctx.fillStyle='#32486c';let mx=Math.floor(W*.82),my=74;ctx.fillRect(mx-18,my-26,36,52);ctx.fillRect(mx-26,my-18,52,36);ctx.fillStyle='#172543';ctx.fillRect(mx-5,my-26,31,42);ctx.fillRect(mx-14,my-17,12,10);
 for(let i=0;i<48;i++){let x=Math.floor((i*97.13)%W),y=Math.floor((i*73.7+time*(i%3+1)*3)%(H-32));ctx.fillStyle=i%6===0?'#ffe28a':i%4===0?'#acffcd':'#607ba3';let size=i%7===0?3:2;ctx.fillRect(x,y,size,size);if(i%13===0){ctx.fillRect(x-2,y+1,7,1);ctx.fillRect(x+1,y-2,1,7);}}
 // Pixel skyline stays behind the playable foreground, without obscuring objects.
 for(let i=0;i<Math.ceil(W/30);i++){let bh=14+(i*17%31);ctx.fillStyle='#172744';ctx.fillRect(i*30,H-27-bh,26,bh);ctx.fillStyle='#304565';ctx.fillRect(i*30+6,H-24-bh,4,4);}
 ctx.fillStyle='#536c91';ctx.fillRect(0,H-27,W,3);ctx.fillStyle='#19243d';ctx.fillRect(0,H-24,W,24);ctx.fillStyle='#304565';for(let x=0;x<W;x+=24)ctx.fillRect(x,H-17,12,3);
for(let it of items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.angle);let color=it.type==='name'?'#ff8fa8':it.type==='num'?'#a7f9d1':it.type==='mystery'?'#ebadff':it.type==='eq'?'#ffe591':({'+':'#79d8ff','−':'#ffaf77','×':'#c7a0ff','÷':'#ff98d3'}[it.value]);pixelBox(-it.w/2,-it.h/2,it.w,it.h,it.type==='name'?'#382137':'#192c42',color);ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 20px system-ui';let label=String(it.value);while(ctx.measureText(label).width>it.w-10&&Array.from(label).length>1){label=Array.from(label.replace(/…$/,'')).slice(0,-1).join('')+'…'}ctx.fillText(label,0,0);ctx.restore()}ctx.save();ctx.globalAlpha=1;pixelBox(player.x-player.w/2,H-35-player.h/2,player.w,player.h,'#acffcd','#e5ffed');ctx.fillStyle='#70caa3';ctx.fillRect(player.x-player.w/2+4,H-35+player.h/2-7,player.w-8,4);ctx.fillStyle='#112b36';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(player.name,player.x,H-35,player.w-8);ctx.restore();if(state==='paused'){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2)}}
function frame(now){let dt=Math.min((now-last)/1000||0,.035);last=now;if(state==='running')tick(dt);if(['running','paused','over'].includes(state))draw();requestAnimationFrame(frame)}
let rankTab='noob',rankRequest=0;
async function showRanks(board=rankTab){rankTab=board;let req=++rankRequest;if(state==='running')pause();$('rankModal').classList.remove('hidden');$('rankRows').replaceChildren();$('rankStatus').textContent='불러오는 중…';try{let rows=await api('rain_boards?select=display_name,score,clear_ms&board=eq.'+board+'&order='+(board==='stage'?'clear_ms.asc,':'score.desc,')+'created_at.asc&limit=50');if(req!==rankRequest)return;$('rankStatus').textContent=rows.length?'닉네임별 최고 기록 · 상위 50명':'아직 기록이 없어요';rows.forEach((r,i)=>{let row=document.createElement('div');row.className='rankrow';for(let text of [i+1,r.display_name,board==='stage'?(r.clear_ms/1000).toFixed(3)+'초':fmt(Number(r.score))+'점']){let el=document.createElement('span');el.textContent=text;row.append(el)}$('rankRows').append(row)})}catch(e){if(req===rankRequest)$('rankStatus').textContent=e.message}}
const tierNames=['챌린저 · 1위','그랜드마스터 · 2위','마스터 · 3위','다이아몬드 · 상위 5%','에메랄드 · 상위 15%','플래티넘 · 상위 30%','골드 · 상위 50%','실버 · 상위 70%','브론즈 · 상위 100%'],tierColors=['#ffda75','#ff697f','#c292ff','#83dfff','#60efb0','#79c9d1','#e3be68','#c4cedf','#b78a67'];
function paintTier(){let i=progress.bestTier;if(i<9){document.documentElement.style.setProperty('--rank',tierColors[i]);$('rankEffect').textContent='이 브라우저 최고 달성: '+tierNames[i]}}
$('submitBtn').onclick=async()=>{if(state!=='over'||submitted||submitting)return;let name=$('rankName').value.trim();if(!name){$('resultStatus').textContent='닉네임을 입력하세요';return}let board=mode==='stage'?'stage':mode,epoch=runEpoch;if(board==='stage'&&(!resultClear||stage!==4))return;submitting=true;$('submitBtn').disabled=true;$('resultStatus').textContent='등록 중…';try{await api('rain_records?on_conflict=run_id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify({run_id:runId,board,display_name:name,score:Number(score.toFixed(5)),survival_ms:Math.round(time*1000),clear_ms:board==='stage'?Math.max(1,Math.round(time*1000)):null})});submitted=true;$('resultStatus').textContent='등록 완료!';try{let rows=await api('rpc/rain_rank',{method:'POST',body:JSON.stringify({p_board:board,p_name:name})}),r=rows[0],pos=Number(r?.place),pct=Number(r?.percentile);if(pos>0){let t=pos<=3?pos-1:pct<=5?3:pct<=15?4:pct<=30?5:pct<=50?6:pct<=70?7:8;progress.bestTier=Math.min(progress.bestTier,t);writeLocal('nameRainCampaignV1',progress);paintTier()}}catch{$('resultStatus').textContent='등록 완료 · 등급 조회는 실패했어요'}}catch(e){$('resultStatus').textContent=e.message;$('submitBtn').disabled=false}finally{submitting=false}};
$('noobBtn').onclick=()=>start('noob',0);$('hardBtn').onclick=()=>start('hard',0);$('stageBtn').onclick=stageScreen;$('gameStageBtn').onclick=stageScreen;$('backStages').onclick=home;$('homeBtn').onclick=home;$('retryBtn').onclick=()=>start();$('againBtn').onclick=()=>start();$('resultStageBtn').onclick=stageScreen;$('resultHomeBtn').onclick=home;$('pauseBtn').onclick=pause;$('rankBtn').onclick=()=>showRanks();$('closeRank').onclick=()=>{$('rankModal').classList.add('hidden');rankRequest++};document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>showRanks(b.dataset.rank));
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});$('installBtn').onclick=async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null}else alert('Chrome 오른쪽 위 ⋮ → 앱 설치 또는 홈 화면에 추가를 눌러 주세요. 이미 설치했다면 홈 화면의 이름비 아이콘으로 실행하세요.')};
window.addEventListener('resize',resize);if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});paintTier();requestAnimationFrame(frame);
